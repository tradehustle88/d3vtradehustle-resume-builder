<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark brick texture pattern -->
  <defs>
    <pattern id="brickPattern" patternUnits="userSpaceOnUse" width="60" height="30">
      <rect width="60" height="30" fill="#2d1b1b"/>
      <rect x="0" y="0" width="58" height="14" fill="#3c2a2a" stroke="#1a1010" stroke-width="0.5"/>
      <rect x="0" y="15" width="28" height="14" fill="#3c2a2a" stroke="#1a1010" stroke-width="0.5"/>
      <rect x="30" y="15" width="28" height="14" fill="#3c2a2a" stroke="#1a1010" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#brickPattern)"/>
</svg>