<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hvacGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1673ff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#001a33;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="#ffffff"/>
  <rect width="400" height="500" fill="url(#hvacGrad)"/>
  
  <!-- Header -->
  <rect x="30" y="30" width="340" height="80" rx="8" fill="#001a33"/>
  <text x="200" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffd700" text-anchor="middle">HVAC TECHNICIAN</text>
  <text x="200" y="85" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">John Smith • EPA Certified</text>
  
  <!-- Content Lines -->
  <rect x="30" y="130" width="340" height="3" fill="#1673ff"/>
  <rect x="30" y="150" width="280" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="30" y="165" width="240" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="30" y="180" width="300" height="8" rx="4" fill="#e0e0e0"/>
  
  <!-- Skills Section -->
  <rect x="30" y="210" width="120" height="25" rx="4" fill="#1673ff" opacity="0.2"/>
  <rect x="160" y="210" width="100" height="25" rx="4" fill="#1673ff" opacity="0.2"/>
  <rect x="30" y="245" width="140" height="25" rx="4" fill="#1673ff" opacity="0.2"/>
  
  <!-- Experience Section -->
  <rect x="30" y="290" width="340" height="2" fill="#1673ff"/>
  <rect x="30" y="310" width="200" height="10" rx="5" fill="#e0e0e0"/>
  <rect x="30" y="330" width="320" height="6" rx="3" fill="#f0f0f0"/>
  <rect x="30" y="345" width="280" height="6" rx="3" fill="#f0f0f0"/>
  <rect x="30" y="360" width="300" height="6" rx="3" fill="#f0f0f0"/>
  
  <!-- Certifications Badge -->
  <circle cx="350" cy="450" r="35" fill="#ffd700" opacity="0.3"/>
  <text x="350" y="455" font-family="Arial, sans-serif" font-size="32" text-anchor="middle">✓</text>
  
  <!-- Footer Icon -->
  <path d="M 200 420 L 180 440 L 200 460 L 220 440 Z" fill="#1673ff" opacity="0.3"/>
</svg>
