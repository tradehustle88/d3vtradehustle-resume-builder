<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1673ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#001a33;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="#ffffff"/>
  <rect width="400" height="500" fill="url(#plumbGrad)"/>
  
  <!-- Header -->
  <rect x="30" y="30" width="340" height="80" rx="8" fill="#001a33"/>
  <text x="200" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1673ff" text-anchor="middle">MASTER PLUMBER</text>
  <text x="200" y="85" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Carlos Rodriguez • Licensed</text>
  
  <!-- Wrench Icon -->
  <rect x="185" y="135" width="30" height="6" rx="3" fill="#1673ff" transform="rotate(45 200 138)"/>
  <circle cx="200" cy="145" r="8" fill="none" stroke="#1673ff" stroke-width="3"/>
  
  <!-- Content -->
  <rect x="30" y="180" width="340" height="3" fill="#1673ff"/>
  <rect x="30" y="200" width="280" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="30" y="215" width="240" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="30" y="230" width="300" height="8" rx="4" fill="#e0e0e0"/>
  
  <!-- Skills -->
  <rect x="30" y="260" width="110" height="25" rx="4" fill="#1673ff" opacity="0.2"/>
  <rect x="150" y="260" width="120" height="25" rx="4" fill="#1673ff" opacity="0.2"/>
  <rect x="30" y="295" width="140" height="25" rx="4" fill="#1673ff" opacity="0.2"/>
  
  <!-- Commercial Badge -->
  <rect x="30" y="420" width="120" height="50" rx="8" fill="#1673ff" opacity="0.2"/>
  <text x="90" y="450" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">🔧</text>
  
  <!-- Experience Lines -->
  <rect x="30" y="350" width="200" height="10" rx="5" fill="#e0e0e0"/>
  <rect x="30" y="370" width="320" height="6" rx="3" fill="#f0f0f0"/>
  <rect x="30" y="385" width="280" height="6" rx="3" fill="#f0f0f0"/>
</svg>
