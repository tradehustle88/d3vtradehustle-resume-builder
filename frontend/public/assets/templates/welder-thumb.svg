<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="weldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e50914;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#001a33;stop-opacity:0.2" />
    </linearGradient>
    <radialGradient id="sparkGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#e50914;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="#ffffff"/>
  <rect width="400" height="500" fill="url(#weldGrad)"/>
  
  <!-- Header -->
  <rect x="30" y="30" width="340" height="80" rx="8" fill="#001a33"/>
  <text x="200" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e50914" text-anchor="middle">CERTIFIED WELDER</text>
  <text x="200" y="85" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">James Thompson • AWS Certified</text>
  
  <!-- Welding Spark Effect -->
  <circle cx="200" cy="145" r="15" fill="url(#sparkGrad)"/>
  <line x1="185" y1="140" x2="175" y2="135" stroke="#ffd700" stroke-width="2"/>
  <line x1="215" y1="140" x2="225" y2="135" stroke="#ffd700" stroke-width="2"/>
  <line x1="200" y1="130" x2="200" y2="120" stroke="#ffd700" stroke-width="2"/>
  
  <!-- Content -->
  <rect x="30" y="180" width="340" height="3" fill="#e50914"/>
  <rect x="30" y="200" width="280" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="30" y="215" width="240" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="30" y="230" width="300" height="8" rx="4" fill="#e0e0e0"/>
  
  <!-- Certifications -->
  <rect x="30" y="260" width="80" height="25" rx="4" fill="#e50914" opacity="0.2"/>
  <text x="70" y="278" font-family="Arial, sans-serif" font-size="12" fill="#001a33" text-anchor="middle">MIG</text>
  <rect x="120" y="260" width="80" height="25" rx="4" fill="#e50914" opacity="0.2"/>
  <text x="160" y="278" font-family="Arial, sans-serif" font-size="12" fill="#001a33" text-anchor="middle">TIG</text>
  <rect x="210" y="260" width="80" height="25" rx="4" fill="#e50914" opacity="0.2"/>
  <text x="250" y="278" font-family="Arial, sans-serif" font-size="12" fill="#001a33" text-anchor="middle">STICK</text>
  
  <!-- AWS Badge -->
  <circle cx="340" cy="445" r="30" fill="#e50914"/>
  <text x="340" y="455" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">AWS</text>
  
  <!-- Experience -->
  <rect x="30" y="350" width="200" height="10" rx="5" fill="#e0e0e0"/>
  <rect x="30" y="370" width="320" height="6" rx="3" fill="#f0f0f0"/>
  <rect x="30" y="385" width="280" height="6" rx="3" fill="#f0f0f0"/>
</svg>
