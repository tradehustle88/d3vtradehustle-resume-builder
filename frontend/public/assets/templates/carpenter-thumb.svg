<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="carpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#001a33;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="#ffffff"/>
  <rect width="400" height="500" fill="url(#carpGrad)"/>
  
  <!-- Header -->
  <rect x="30" y="30" width="340" height="80" rx="8" fill="#001a33"/>
  <text x="200" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#8b4513" text-anchor="middle">MASTER CARPENTER</text>
  <text x="200" y="85" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">David Martinez • Finish Expert</text>
  
  <!-- Hammer Icon -->
  <rect x="190" y="130" width="8" height="35" rx="2" fill="#8b4513"/>
  <rect x="175" y="125" width="38" height="10" rx="2" fill="#8b4513"/>
  
  <!-- Content -->
  <rect x="30" y="180" width="340" height="3" fill="#8b4513"/>
  <rect x="30" y="200" width="280" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="30" y="215" width="240" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="30" y="230" width="300" height="8" rx="4" fill="#e0e0e0"/>
  
  <!-- Skills -->
  <rect x="30" y="260" width="100" height="25" rx="4" fill="#8b4513" opacity="0.2"/>
  <rect x="140" y="260" width="110" height="25" rx="4" fill="#8b4513" opacity="0.2"/>
  <rect x="260" y="260" width="110" height="25" rx="4" fill="#8b4513" opacity="0.2"/>
  <rect x="30" y="295" width="140" height="25" rx="4" fill="#8b4513" opacity="0.2"/>
  
  <!-- Blueprint Icon -->
  <rect x="280" y="410" width="90" height="60" rx="4" fill="#1673ff" opacity="0.1"/>
  <line x1="290" y1="425" x2="360" y2="425" stroke="#1673ff" stroke-width="1"/>
  <line x1="290" y1="435" x2="340" y2="435" stroke="#1673ff" stroke-width="1"/>
  <line x1="290" y1="445" x2="350" y2="445" stroke="#1673ff" stroke-width="1"/>
  
  <!-- Experience -->
  <rect x="30" y="350" width="200" height="10" rx="5" fill="#e0e0e0"/>
  <rect x="30" y="370" width="320" height="6" rx="3" fill="#f0f0f0"/>
  <rect x="30" y="385" width="280" height="6" rx="3" fill="#f0f0f0"/>
