  <text x="325" y="450" font-family="Arial, sans-serif" font-size="28" fill="#ffd700" text-anchor="middle">⚡</text>
  
  <!-- Experience -->
  <rect x="30" y="360" width="200" height="10" rx="5" fill="#e0e0e0"/>
  <rect x="30" y="380" width="320" height="6" rx="3" fill="#f0f0f0"/>
  <rect x="30" y="395" width="280" height="6" rx="3" fill="#f0f0f0"/>
