<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="elecGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#001a33;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="#ffffff"/>
  <rect width="400" height="500" fill="url(#elecGrad)"/>
  
  <!-- Header -->
  <rect x="30" y="30" width="340" height="80" rx="8" fill="#001a33"/>
  <text x="200" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffd700" text-anchor="middle">ELECTRICIAN</text>
  <text x="200" y="85" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Mike Johnson • Master License</text>
  
  <!-- Lightning Bolt Icon -->
  <path d="M 190 135 L 200 155 L 195 155 L 205 175 L 195 160 L 200 160 Z" fill="#ffd700"/>
  
  <!-- Content Lines -->
  <rect x="30" y="200" width="340" height="3" fill="#ffd700"/>
  <rect x="30" y="220" width="280" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="30" y="235" width="240" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="30" y="250" width="300" height="8" rx="4" fill="#e0e0e0"/>
  
  <!-- Skills Grid -->
  <rect x="30" y="280" width="100" height="25" rx="4" fill="#ffd700" opacity="0.2"/>
  <rect x="140" y="280" width="110" height="25" rx="4" fill="#ffd700" opacity="0.2"/>
  <rect x="260" y="280" width="110" height="25" rx="4" fill="#ffd700" opacity="0.2"/>
  <rect x="30" y="315" width="130" height="25" rx="4" fill="#ffd700" opacity="0.2"/>
  
  <!-- License Badge -->
