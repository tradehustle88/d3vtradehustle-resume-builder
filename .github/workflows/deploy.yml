name: Deploy to Firebase

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      # Install root dependencies
      - name: Install root dependencies
        run: npm install
      
      # Install function dependencies
      - name: Install Firebase Functions dependencies
        working-directory: ./functions
        run: npm install
      
      # Build functions (if TypeScript/bundler)
      - name: Build functions
        working-directory: ./functions
        run: npm run build --if-present
      
      # Build hosting (if needed)
      - name: Build hosting
        run: npm run build --if-present

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/190054658629/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "tradehustle-backend@tradehustleresumebuilder.iam.gserviceaccount.com"

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Firebase project
        run: |
          npm install -g firebase-tools
          firebase use tradehustleresumebuilder
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      
      - name: Deploy to Firebase
        run: firebase deploy --only functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
