name: Deploy Firebase Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Only run on the main repository (prevents fork deployments)
    if: github.repository == 'tradehustle88/d3vtradehustle-resume-builder'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-functions-${{ hashFiles('api-functions/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-functions-

      - name: Install Firebase Functions dependencies
        working-directory: ./api-functions
        run: npm ci

      - name: Build functions
        working-directory: ./api-functions
        run: npm run build --if-present

      - name: Deploy to Firebase
        run: |
          npm install -g firebase-tools
          firebase deploy --only functions --project tradehustleresumebuilder
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
