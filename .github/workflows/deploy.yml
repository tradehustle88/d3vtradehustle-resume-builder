name: Deploy to Firebase

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/190054658629/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "tradehustle-backend@tradehustleresumebuilder.iam.gserviceaccount.com"

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install dependencies in functions
        run: |
          cd functions
          npm install

      - name: Deploy to Firebase Hosting and Functions
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting,functions --non-interactive
