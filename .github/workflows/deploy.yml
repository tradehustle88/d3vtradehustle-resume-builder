name: Deploy to Firebase

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate with Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > ${HOME}/firebase-key.json
          gcloud auth activate-service-account --key-file=${HOME}/firebase-key.json
          gcloud --quiet config set project tradehustleresumebuilder

      - name: Install dependencies in functions
        run: |
          cd functions
          npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting and Functions
        run: |
          firebase deploy --only hosting,functions --non-interactive --token "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
