name: Deploy to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch: # allows manual runs from Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'api-functions/package-lock.json'

      # Save service account to a file BEFORE deploy
      - name: Write Firebase key file
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/firebase-key.json

      # Authenticate with Google Cloud using service account
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Set up gcloud SDK
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: tradehustleresumebuilder

      # Install dependencies for functions
      - name: Install functions dependencies
        run: |
          cd api-functions
          npm install

      # Build and export Next.js frontend
      - name: Build and export Next.js frontend
        run: |
          cd frontend
          npm install
          npm run build

      # Deploy to Firebase Hosting + Functions
      - name: Deploy to Firebase
        env:
          RECAPTCHA_SECRET: ${{ secrets.RECAPTCHA_SECRET }}
        run: |
          npm install -g firebase-tools
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-key.json"
          echo "RECAPTCHA_SECRET=$RECAPTCHA_SECRET" > api-functions/.env
          firebase deploy --only hosting,functions --non-interactive --project tradehustleresumebuilder
